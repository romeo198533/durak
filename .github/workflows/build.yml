name: Сборка

# Контейнер агента работает на ARM, а сборка Android требует инструмента
# от Google, выпущенного только под x86_64. Поэтому APK собирается здесь,
# на обычных машинах GitHub: для публичного репозитория это бесплатно.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Поставить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать
        run: gradle assembleDebug --no-daemon

      - name: Выложить файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: durak-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
