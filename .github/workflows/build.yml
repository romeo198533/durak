name: Сборка

# Контейнер агента работает на ARM, а сборка Android требует инструмента
# от Google, выпущенного только под x86_64. Поэтому APK собирается здесь,
# на обычных машинах GitHub: для публичного репозитория это бесплатно.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Поставить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Партии гоняются до сборки: движок и протокол не знают про Android, и
      # шестьсот партий вхолостую ловят ошибку в правилах или в проводе
      # раньше, чем она доедет до телефона.
      #
      # Сначала правила: оба игрока — программы, ходы идут прямо в движок.
      # Потом сетевая партия: то же самое, но каждый ход едет строкой через
      # Wire, и каждый игрок играет по одному только своему виду места.
      #
      # Файлы перечислены поимённо, а не звёздочкой: рядом лежат экраны, и без
      # Android их не собрать. Список короткий и меняется редко.
      - name: Прогнать партии вхолостую
        run: |
          mkdir -p /tmp/engine
          javac -d /tmp/engine \
            app/src/main/java/ru/romeo198533/durak/Card.java \
            app/src/main/java/ru/romeo198533/durak/Cards.java \
            app/src/main/java/ru/romeo198533/durak/Ru.java \
            app/src/main/java/ru/romeo198533/durak/Game.java \
            app/src/main/java/ru/romeo198533/durak/Bot.java \
            app/src/main/java/ru/romeo198533/durak/Seat.java \
            app/src/main/java/ru/romeo198533/durak/Wire.java \
            app/src/main/java/ru/romeo198533/durak/Table.java \
            tools/EngineTest.java \
            tools/NetTest.java
          java -cp /tmp/engine EngineTest
          java -cp /tmp/engine NetTest

      # Сборка release, а не debug: подпись ставится снаружи, своим ключом.
      # Ключ, которым Android подписывает debug-сборки, генерируется заново
      # каждый раз, и обновление поверх такой сборки не встало бы.
      - name: Собрать
        run: gradle assembleRelease --no-daemon

      - name: Выложить файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: durak-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
